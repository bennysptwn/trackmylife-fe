<div
  class="max-h-screen w-full dark-bg-[#050505] flex items-center lg:flex-row lg:justify-between gap-10 lg:p-40 p-8"
>
  <div class="w-full lg:w-1/2">
    <!-- Header -->
    <div class="mb-8 flex flex-col gap-2">
      <a
        routerLink="/"
        class="inline-flex items-center text-sm text-neutral-400 hover:text-white transition-colors mb-6 group"
      >
        <app-icon
          name="arrow-left"
          size="16"
          class="mr-2 group-hover:-translate-x-1 transition-transform"
        />
        Back to Home
      </a>
      <img src="trackmylife-logo.png" class="w-30" />
      <h1 class="text-2xl font-bold">Welcome Back</h1>
      <p class="text-neutral-400 text-sm">Log in to access your dashboard</p>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-5">
      <app-text-field title="Email" icon="mail" />
      <app-text-field title="Password" icon="lock" />
      @if (isRegister()) {
      <app-text-field title="Confirm Password" icon="lock" />
      }
      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 cursor-pointer group">
          <input
            type="checkbox"
            class="w-4 h-4 rounded border-white/10 bg-[#121212] text-indigo-600 focus:ring-indigo-500/20 focus:ring-offset-0"
          />
          <span
            class="text-neutral-400 group-hover:text-neutral-300 transition-colors"
            >Remember me</span
          >
        </label>
        <app-text-button title="Forgot password?" />
      </div>

      <!-- Action -->
      <app-button
        [title]="isRegister() ? 'Sign Up' : 'Log In'"
        [isBorder]="false"
        [fullWidth]="true"
        (click)="submit()"
      />
    </form>

    <!-- Divider -->
    <div class="relative my-8">
      <div class="relative flex justify-center text-xs">
        <span class="text-neutral-500">or continue with</span>
      </div>
    </div>

    <!-- Socials -->
    <app-button title="Google" [fullWidth]="true" />

    <div class="mt-8 text-center text-xs text-neutral-500">
      {{ isRegister() ? 'Already have an account?' : 'Don\'t have an account?'
      }}
      <app-text-button
        title="{{isRegister() ? 'Log In' : 'Sign Up'}}"
        (click)="setRegister()"
      />
    </div>
  </div>
  <!-- background image -->
  <div class="hidden lg:block">
    <img
      src="setup.jpg"
      class="rounded-lg shadow-lg p-10 object-cover max-h-screen overflow-hidden"
    />
  </div>
</div>
