<header>
  <div
    class="w-full flex flex-row justify-between py-4 px-4 lg:px-24 items-center sticky top-0 shadow-sm"
  >
    <div><img src="trackmylife-logo.png" width="130px" height="12px" /></div>
    <div class="flex flex-row items-center gap-6">
      <button
        (click)="themeService.toggleTheme()"
        class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        aria-label="Toggle dark mode"
      >
        @if (themeService.isDark()) {
        <!-- Sun Icon -->
        <app-icon name="sun" class="w-6 h-6 text-white" size="24" />
        } @else {
        <!-- Moon Icon -->
        <app-icon name="moon" class="w-6 h-6 text-slate-700" size="24" />
        }
      </button>
      <app-button
        title="Login"
        [isBorder]="false"
        class="font-bold lg:visible hidden"
        routerLink="/auth"
        [queryParams]="{ mode: 'login' }"
      />
      <app-button
        title="Get Started"
        [isBorder]="false"
        class="font-bold"
        routerLink="/auth"
        [queryParams]="{ mode: 'register' }"
      />
    </div>
  </div>
</header>
